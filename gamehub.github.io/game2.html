<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>躲避紅色敵人</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }
    #gameCanvas {
      display: block;
      background: #111;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 48px;
      font-weight: bold;
      display: none;
    }
    #instructions {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="instructions">使用 WASD 或方向鍵移動</div>
  <div id="gameOver">遊戲結束！</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverText = document.getElementById('gameOver');

    // 設定畫布大小
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 玩家設定
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 20,
      speed: 5
    };

    // 敵人（紅色）
    const enemy = {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 20,
      baseSpeed: 1.0,
      speed: 1.0
    };

    // 障礙物（靜態）
    const obstacles = [];
    const obstacleCount = 30;
    const obstacleSize = 30;

    // 生成障礙物（避免與玩家或敵人重疊）
    function generateObstacles() {
      for (let i = 0; i < obstacleCount; i++) {
        let valid = false;
        let ox, oy;
        while (!valid) {
          ox = Math.random() * (canvas.width - obstacleSize);
          oy = Math.random() * (canvas.height - obstacleSize);
          // 檢查是否與玩家或敵人太近
          const distToPlayer = Math.hypot(ox + obstacleSize/2 - player.x, oy + obstacleSize/2 - player.y);
          const distToEnemy = Math.hypot(ox + obstacleSize/2 - enemy.x, oy + obstacleSize/2 - enemy.y);
          if (distToPlayer > 100 && distToEnemy > 100) {
            valid = true;
            obstacles.push({x: ox, y: oy, w: obstacleSize, h: obstacleSize});
          }
        }
      }
    }

    generateObstacles();

    // 鍵盤控制
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // 檢查碰撞（AABB）
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.w &&
             rect1.x + rect1.w > rect2.x &&
             rect1.y < rect2.y + rect2.h &&
             rect1.y + rect1.h > rect2.y;
    }

    // 遊戲狀態
    let gameRunning = true;
    let timeElapsed = 0;

    // 主遊戲循環
    function gameLoop(timestamp) {
      if (!gameRunning) return;

      // 清空畫布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 更新時間（用於加速敵人）
      timeElapsed += 16; // 約每幀 16ms
      enemy.speed = enemy.baseSpeed + timeElapsed / 5000; // 每 5 秒增加一點速度

      // 玩家移動
      let newX = player.x;
      let newY = player.y;
      if ((keys['w'] || keys['arrowup']) && player.y > 0) newY -= player.speed;
      if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.size) newY += player.speed;
      if ((keys['a'] || keys['arrowleft']) && player.x > 0) newX -= player.speed;
      if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.size) newX += player.speed;

      // 檢查障礙物碰撞（玩家）
      const tempPlayerRect = {x: newX, y: newY, w: player.size, h: player.size};
      let canMove = true;
      for (const obs of obstacles) {
        if (checkCollision(tempPlayerRect, obs)) {
          canMove = false;
          break;
        }
      }
      if (canMove) {
        player.x = newX;
        player.y = newY;
      }

      // 敵人朝玩家移動
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        enemy.x += (dx / dist) * enemy.speed;
        enemy.y += (dy / dist) * enemy.speed;
      }

      // 繪製障礙物
      ctx.fillStyle = '#555';
      for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      // 繪製玩家
      ctx.fillStyle = 'blue';
      ctx.fillRect(player.x, player.y, player.size, player.size);

      // 繪製敵人
      ctx.fillStyle = 'red';
      ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);

      // 檢查玩家與敵人碰撞
      const playerRect = {x: player.x, y: player.y, w: player.size, h: player.size};
      const enemyRect = {x: enemy.x, y: enemy.y, w: enemy.size, h: enemy.size};
      if (checkCollision(playerRect, enemyRect)) {
        gameRunning = false;
        gameOverText.style.display = 'block';
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    // 啟動遊戲
    requestAnimationFrame(gameLoop);

    // 視窗調整時重新設定畫布
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
